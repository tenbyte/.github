<svg width="250" height="70" viewBox="0 0 250 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .digit-col { font-family: "Courier New", Courier, monospace; font-size: 24px; fill: #00d2ff; font-weight: 900; filter: drop-shadow(0 0 4px rgba(0, 210, 255, 0.5)); }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #8892b0; letter-spacing: 1.5px; }
      .arm { transform-origin: 220px 45px; animation: pull 1s ease-in-out forwards; }
      @keyframes pull { 0% { transform: rotate(0deg); } 50% { transform: rotate(100deg); } 100% { transform: rotate(0deg); } }
      .roll-0 { animation: roll-0 1.50s cubic-bezier(0.2, 0.8, 0.2, 1) 1.2s forwards; }
@keyframes roll-0 { 0% { transform: translateY(0); } 100% { transform: translateY(-300px); } }
.roll-1 { animation: roll-1 2.00s cubic-bezier(0.2, 0.8, 0.2, 1) 1.2s forwards; }
@keyframes roll-1 { 0% { transform: translateY(0); } 100% { transform: translateY(-660px); } }
.roll-2 { animation: roll-2 2.50s cubic-bezier(0.2, 0.8, 0.2, 1) 1.2s forwards; }
@keyframes roll-2 { 0% { transform: translateY(0); } 100% { transform: translateY(-990px); } }
.roll-3 { animation: roll-3 3.00s cubic-bezier(0.2, 0.8, 0.2, 1) 1.2s forwards; }
@keyframes roll-3 { 0% { transform: translateY(0); } 100% { transform: translateY(-1320px); } }
.roll-4 { animation: roll-4 3.50s cubic-bezier(0.2, 0.8, 0.2, 1) 1.2s forwards; }
@keyframes roll-4 { 0% { transform: translateY(0); } 100% { transform: translateY(-1560px); } }
.roll-5 { animation: roll-5 4.00s cubic-bezier(0.2, 0.8, 0.2, 1) 1.2s forwards; }
@keyframes roll-5 { 0% { transform: translateY(0); } 100% { transform: translateY(-1680px); } }
